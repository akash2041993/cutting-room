<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="robots" content="noindex">
<title>Choose a new password - {name}</title>
<link rel="stylesheet" href="site.css">
</head>
<body>
<main>
<a class="brand" href="index.html"><i></i><span data-cfg="BUSINESS_NAME">Cutting Room</span></a>
<h1>Choose a new password</h1>
<p id="intro" class="muted">Checking your reset link…</p>
<form id="f" class="card" hidden novalidate>
  <div class="field"><label for="p1">New password</label><input id="p1" type="password" minlength="8" autocomplete="new-password" placeholder="At least 8 characters"></div>
  <div class="field"><label for="p2">Type it again</label><input id="p2" type="password" minlength="8" autocomplete="new-password"></div>
  <p id="msg" class="msg" role="status" aria-live="polite"></p>
  <button id="go" class="btn" type="submit">Save new password</button>
</form>
<p id="done" class="msg ok" hidden>Password changed. Open the app and sign in with your new password.</p>
<p id="bad" class="msg err" hidden>This link has expired or was already used. Go back to the app, tap <em>Forgot password</em> and ask for a new email.</p>
<footer><a href="index.html">Home</a><a href="terms.html">Terms</a><a href="privacy.html">Privacy</a><a href="refund.html">Refunds</a></footer>
</main>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script src="site.js"></script>
<script>
(function () {
  var C = window.APP_CONFIG || {};
  var $ = function (id) { return document.getElementById(id); };
  var bad = function () { $('intro').hidden = true; $('f').hidden = true; $('bad').hidden = false; };
  if (!window.supabase || !C.SUPABASE_URL || /PASTE_YOUR/.test(C.SUPABASE_URL) || /PASTE_YOUR/.test(C.SUPABASE_ANON_KEY || '')) return bad();
  var sb = window.supabase.createClient(C.SUPABASE_URL, C.SUPABASE_ANON_KEY, { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: true } });
  var ready = false;
  var show = function () { if (ready) return; ready = true; $('intro').textContent = 'Type your new password below.'; $('f').hidden = false; $('p1').focus(); };
  sb.auth.onAuthStateChange(function (ev, session) { if (ev === 'PASSWORD_RECOVERY' || (ev === 'SIGNED_IN' && session)) show(); });
  setTimeout(function () { sb.auth.getSession().then(function (r) { if (r.data && r.data.session) show(); else if (!ready) bad(); }, bad); }, 1500);
  $('f').addEventListener('submit', function (e) {
    e.preventDefault();
    var a = $('p1').value, b = $('p2').value, m = $('msg');
    m.className = 'msg err';
    if (a.length < 8) { m.textContent = 'Use at least 8 characters.'; return; }
    if (a !== b) { m.textContent = 'The two passwords are not the same.'; return; }
    $('go').disabled = true; m.className = 'msg'; m.textContent = 'Saving…';
    sb.auth.updateUser({ password: a }).then(function (r) {
      if (r.error) { $('go').disabled = false; m.className = 'msg err'; m.textContent = /same|different/i.test(r.error.message || '') ? 'Choose a password you have not used before.' : (r.error.message || 'Could not save. Try again.'); return; }
      $('f').hidden = true; $('intro').hidden = true; $('done').hidden = false;
      sb.auth.signOut().catch(function () {});
    }, function () { $('go').disabled = false; m.className = 'msg err'; m.textContent = 'No connection. Try again.'; });
  });
})();
</script>
</body>
</html>
